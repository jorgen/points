name: Deploy points.limilind.com

# Builds and deploys the points web service (the React SPA + WebGL2/WASM renderer, served by a prism
# static-file backend). Runs only when something that affects the bundle changes, so ordinary library work
# (tools/, tests/, native-only paths) does not redeploy. Merging to master rebuilds the image and redeploys.
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'examples/renderer/**'
      - 'backend/**'
      - 'deploy/**'
      - 'CMake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'examples/renderer/**'
      - 'backend/**'
      - 'deploy/**'
      - 'CMake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR gate: prove the renderer WASM + SPA still build. On push to master the image job rebuilds everything
  # in Docker, so this check is not repeated there.
  build:
    name: Build renderer WASM + SPA
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (Ninja, CMake >= 3.30)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          pipx install cmake
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.3
      - name: Build the WebGL2 renderer WASM
        run: |
          emcmake cmake -S . -B cmake-build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build cmake-build-wasm --target points_render_wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: examples/renderer/web/package-lock.json
      - run: npm ci
        working-directory: examples/renderer/web
      - run: npm run build # copy-wasm -> tsc --noEmit && vite build
        working-directory: examples/renderer/web

  image:
    name: Build & push image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/jorgen/points:latest
            ghcr.io/jorgen/points:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to droplet
    needs: [image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # The droplet stack (compose + update.sh) is owned by github.com/jorgen/limilind-edge; here we only
      # trigger a redeploy of the points service.
      - name: Redeploy the points service over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "DEPLOY_HOST/DEPLOY_SSH_KEY not set — skipping deploy."
            exit 0
          fi
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/stdin "$HOME/.ssh/deploy_key" <<<"$DEPLOY_SSH_KEY"
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
            hostkey="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          else
            hostkey="-o StrictHostKeyChecking=accept-new"
          fi
          ssh $hostkey -i "$HOME/.ssh/deploy_key" "deploy@$DEPLOY_HOST" "/opt/stack/update.sh points $SHA"
